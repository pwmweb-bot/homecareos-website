<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 686" role="img" aria-labelledby="mb-weighted-t mb-weighted-d" font-family="DM Sans, system-ui, -apple-system, sans-serif">
  <title id="mb-weighted-t">Weighted, not averaged: two branches of very different size</title>
  <desc id="mb-weighted-d">Example. Each square is 30 visits. Branch A has 30 visits, shown as one square, and delivered 18 of them, 60%. Branch B has 3,000 visits, shown as 100 squares, and delivered 2,850 of them, 95%, so it has 100 times the visits. Averaging the two percentages gives 77.5%, which gives 30 visits the same say as 3,000. The homecareOS group figure is weighted: 2,868 of 3,030 visits delivered, 94.7%.</desc>
  <style>
    .mb-weighted-lab { font-size: 17px; font-weight: 600; fill: #374151; }
    .mb-weighted-strong { font-weight: 700; fill: #16323D; }
    .mb-weighted-val { font-size: 24px; font-weight: 700; fill: #16323D; }
    .mb-weighted-muted { fill: #6b7280; }
    .mb-weighted-sub { font-size: 17px; font-weight: 400; fill: #6b7280; }
    .mb-weighted-pill { fill: #4b5563; }
    .mb-weighted-dark { fill: #374151; }
    .mb-weighted-name { font-size: 19px; font-weight: 700; fill: #111827; }
    .mb-weighted-meta { font-size: 17px; font-weight: 400; fill: #4b5563; }
    .mb-weighted-rate { font-size: 17px; font-weight: 600; fill: #16323D; }
  </style>

  <rect x="0.75" y="0.75" width="86" height="28" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="43.75" y="20.5" text-anchor="middle" class="mb-weighted-lab mb-weighted-pill">Example</text>
  <text class="mb-weighted-meta" x="102" y="20.5">Each square is 30 visits</text>

  <rect x="0" y="45" width="16" height="16" rx="2" fill="#16323D"/>
  <text class="mb-weighted-meta" x="24" y="59">Delivered</text>
  <rect x="124.75" y="45.75" width="14.5" height="14.5" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="mb-weighted-meta" x="148" y="59">Not delivered</text>

  <text class="mb-weighted-meta" x="130" y="188" text-anchor="middle">Branch B has</text>
  <text class="mb-weighted-lab" x="130" y="213" text-anchor="middle">100 times the visits</text>
