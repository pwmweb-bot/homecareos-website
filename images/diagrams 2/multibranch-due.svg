<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" role="img" aria-labelledby="mb-due-t mb-due-d" font-family="DM Sans, system-ui, -apple-system, sans-serif">
<title id="mb-due-t">Only visits that have happened are counted</title>
<desc id="mb-due-d">An example day at Branch A drawn as a timeline with a line marking now. Before now, four visits were completed, one was missed and one was cancelled. After now, three visits are booked. The completed and missed visits are counted as due. The cancelled visit and the three booked visits are greyed and not counted. Visits delivered is 4 of 5 due, 80 percent, so the branch is not marked down for visits that have not happened yet.</desc>
<text x="20" y="22" font-size="17" fill="#6b7280">Example day, Branch A</text>
<text x="20" y="58" font-size="17" font-weight="700" fill="#16323D">Window closed</text>
<text x="500" y="58" font-size="17" font-weight="700" fill="#6b7280" text-anchor="end">Still to come</text>
