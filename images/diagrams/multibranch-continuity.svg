<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" role="img" aria-labelledby="mb-continuity-t mb-continuity-d" font-family="DM Sans, system-ui, -apple-system, sans-serif">
  <title id="mb-continuity-t">How continuity of carer is worked out</title>
  <desc id="mb-continuity-d">Example. One person has 10 visits. Seven were carried out by Carer 1, the carer they see most, and three by others: two by Carer 2 and one by Carer 3. Continuity for this person is 7 of 10, or 70 percent. The branch figure is the average of that share across everyone the branch supports: in this example Person 1 at 70 percent, Person 2 at 90 percent and Person 3 at 80 percent average to 80 percent for Branch A.</desc>

  <!-- Header -->
  <rect x="16" y="4" width="84" height="28" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="58" y="24" text-anchor="middle" font-size="17" font-weight="500" fill="#4b5563">Example</text>
  <text x="114" y="25" font-size="19" font-weight="600" fill="#16323D">One person, 10 visits</text>

  <!-- 7 visits by Carer 1 (seen most) -->
  <g font-size="17" font-weight="600" text-anchor="middle">
    <g fill="#16323D">
      <circle cx="44" cy="78" r="19"/>
      <circle cx="90" cy="78" r="19"/>
      <circle cx="136" cy="78" r="19"/>
      <circle cx="182" cy="78" r="19"/>
      <circle cx="228" cy="78" r="19"/>
      <circle cx="274" cy="78" r="19"/>
      <circle cx="320" cy="78" r="19"/>
    </g>
    <g fill="#ffffff">
      <text x="44" y="84">1</text>
      <text x="90" y="84">1</text>
      <text x="136" y="84">1</text>
      <text x="182" y="84">1</text>
      <text x="228" y="84">1</text>
      <text x="274" y="84">1</text>
      <text x="320" y="84">1</text>
    </g>

    <!-- 3 visits by others -->
    <circle cx="384" cy="78" r="19" fill="#9ca3af"/>
    <circle cx="430" cy="78" r="19" fill="#9ca3af"/>
    <circle cx="476" cy="78" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <text x="384" y="84" fill="#111827">2</text>
    <text x="430" y="84" fill="#111827">2</text>
    <text x="476" y="84" fill="#374151">3</text>
  </g>

  <!-- Brackets -->
  <path d="M25 106 V114 H339 V106 M182 114 V121" fill="none" stroke="#16323D" stroke-width="1.5"/>
  <path d="M365 106 V114 H495 V106 M430 114 V121" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <text x="182" y="143" text-anchor="middle" font-size="17" font-weight="600" fill="#16323D">7 by Carer 1</text>
  <text x="182" y="164" text-anchor="middle" font-size="17" fill="#4b5563">the carer they see most</text>
  <text x="430" y="143" text-anchor="middle" font-size="17" font-weight="600" fill="#374151">3 by others</text>
  <text x="430" y="164" text-anchor="middle" font-size="17" fill="#4b5563">Carer 2, Carer 3</text>

  <!-- Result -->
  <rect x="16" y="184" width="488" height="68" rx="10" fill="#f6f1e7" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="34" y="212" font-size="19" font-weight="600" fill="#16323D">Continuity for this person</text>
  <text x="34" y="237" font-size="17" fill="#4b5563">7 of 10 visits by Carer 1</text>
  <text x="484" y="229" text-anchor="end" font-size="34" font-weight="700" fill="#16323D">70%</text>
  <rect x="420" y="236" width="64" height="4" rx="2" fill="#E8A14A"/>

  <!-- Branch figure -->
  <line x1="16" y1="276" x2="504" y2="276" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="16" y="306" font-size="17" font-weight="600" fill="#16323D">The branch figure averages everyone it supports</text>

  <g text-anchor="middle">
    <rect x="16" y="322" width="100" height="60" rx="10" fill="#ffffff" stroke="#E8A14A" stroke-width="2"/>
    <text x="66" y="346" font-size="17" fill="#4b5563">Person 1</text>
    <text x="66" y="371" font-size="20" font-weight="700" fill="#16323D">70%</text>

    <rect x="126" y="322" width="100" height="60" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="176" y="346" font-size="17" fill="#4b5563">Person 2</text>
    <text x="176" y="371" font-size="20" font-weight="700" fill="#16323D">90%</text>

    <rect x="236" y="322" width="100" height="60" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="286" y="346" font-size="17" fill="#4b5563">Person 3</text>
    <text x="286" y="371" font-size="20" font-weight="700" fill="#16323D">80%</text>

    <path d="M346 352 H376 M369 345 L377 352 L369 359" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="388" y="322" width="116" height="60" rx="10" fill="#16323D"/>
    <text x="446" y="346" font-size="17" fill="#ffffff">Branch A</text>
    <text x="446" y="372" font-size="22" font-weight="700" fill="#ffffff">80%</text>
  </g>

  <text x="260" y="414" text-anchor="middle" font-size="17" fill="#4b5563">(70% + 90% + 80%) ÷ 3 = 80%</text>
</svg>
