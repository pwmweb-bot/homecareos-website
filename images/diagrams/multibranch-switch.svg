<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 296" role="img" aria-labelledby="mb-switch-t mb-switch-d" font-family="DM Sans, system-ui, -apple-system, sans-serif">
  <title id="mb-switch-t">Switching branch with Cmd+B</title>
  <desc id="mb-switch-d">Three steps from left to right. First, press the Cmd and B keys together, or Ctrl+B on Windows. This opens the branch switcher, a short list with Group overview at the top and Branch A to Branch D numbered 1 to 4. Second, press a number: 2 is highlighted beside Branch B. Third, Branch B opens with a You are here marker, and you work there with the role you hold at that branch, in this example Registered manager. An Example tag notes that your role can differ in each branch.</desc>

  <!-- Step headings -->
  <g font-size="17" font-weight="600" fill="#4b5563" text-anchor="middle">
    <text x="71" y="24">Press</text>
    <text x="262" y="24">Pick a number</text>
    <text x="448" y="24">You’re in</text>
  </g>

  <!-- Step 1: keycaps -->
  <g>
    <rect x="2" y="128" width="64" height="46" rx="10" fill="#16323D"/>
    <rect x="2" y="124" width="64" height="46" rx="10" fill="#ffffff" stroke="#16323D" stroke-width="2"/>
    <text x="34" y="154" font-size="20" font-weight="700" fill="#16323D" text-anchor="middle">Cmd</text>

    <text x="77" y="154" font-size="20" font-weight="600" fill="#6b7280" text-anchor="middle">+</text>

    <rect x="88" y="128" width="52" height="46" rx="10" fill="#16323D"/>
    <rect x="88" y="124" width="52" height="46" rx="10" fill="#ffffff" stroke="#16323D" stroke-width="2"/>
    <text x="114" y="154" font-size="20" font-weight="700" fill="#16323D" text-anchor="middle">B</text>

    <text x="71" y="206" font-size="17" fill="#6b7280" text-anchor="middle">or <tspan font-weight="600" fill="#374151">Ctrl+B</tspan></text>
    <text x="71" y="227" font-size="17" fill="#6b7280" text-anchor="middle">on Windows</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="148" y1="147" x2="166" y2="147" stroke="#24485A" stroke-width="2" stroke-linecap="round"/>
  <polygon points="165,141 174,147 165,153" fill="#24485A"/>

  <!-- Step 2: branch switcher -->
  <g>
    <rect x="182" y="44" width="160" height="196" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

    <rect x="190" y="52" width="144" height="36" rx="8" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="262" y="76" font-size="17" font-weight="500" fill="#24485A" text-anchor="middle">Group overview</text>

    <g font-size="17">
      <!-- 1 -->
      <rect x="200" y="101" width="24" height="24" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
      <text x="212" y="119" font-weight="600" fill="#4b5563" text-anchor="middle">1</text>
      <text x="234" y="119" fill="#374151">Branch A</text>

      <!-- 2, highlighted -->
      <rect x="190" y="131" width="144" height="32" rx="8" fill="#f6f1e7" stroke="#E8A14A" stroke-width="2"/>
      <rect x="200" y="135" width="24" height="24" rx="6" fill="#E8A14A"/>
      <text x="212" y="153" font-weight="700" fill="#16323D" text-anchor="middle">2</text>
      <text x="234" y="153" font-weight="700" fill="#16323D">Branch B</text>

      <!-- 3 -->
      <rect x="200" y="169" width="24" height="24" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
      <text x="212" y="187" font-weight="600" fill="#4b5563" text-anchor="middle">3</text>
      <text x="234" y="187" fill="#374151">Branch C</text>

      <!-- 4 -->
      <rect x="200" y="203" width="24" height="24" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
      <text x="212" y="221" font-weight="600" fill="#4b5563" text-anchor="middle">4</text>
      <text x="234" y="221" fill="#374151">Branch D</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <line x1="350" y1="147" x2="364" y2="147" stroke="#24485A" stroke-width="2" stroke-linecap="round"/>
  <polygon points="363,141 372,147 363,153" fill="#24485A"/>

  <!-- Step 3: Branch B opened -->
  <g>
    <rect x="386" y="52" width="124" height="30" rx="15" fill="#E8A14A"/>
    <polygon points="440,81 456,81 448,90" fill="#E8A14A"/>
    <text x="448" y="73" font-size="17" font-weight="700" fill="#16323D" text-anchor="middle">You are here</text>

    <rect x="378" y="96" width="140" height="144" rx="12" fill="#ffffff" stroke="#16323D" stroke-width="2"/>
    <path d="M378,108 a12,12 0 0 1 12,-12 h116 a12,12 0 0 1 12,12 v28 h-140 z" fill="#16323D"/>
    <text x="448" y="123" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Branch B</text>

    <text x="448" y="168" font-size="17" fill="#6b7280" text-anchor="middle">Your role here</text>
    <text x="448" y="196" font-size="18" font-weight="700" fill="#16323D" text-anchor="middle">Registered</text>
    <text x="448" y="218" font-size="18" font-weight="700" fill="#16323D" text-anchor="middle">manager</text>
  </g>

  <!-- Footer: example tag -->
  <g>
    <rect x="62" y="262" width="84" height="26" rx="13" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="104" y="281" font-size="17" font-weight="600" fill="#4b5563" text-anchor="middle">Example</text>
    <text x="156" y="281" font-size="17" fill="#4b5563">Your role can differ in each branch</text>
  </g>
</svg>
